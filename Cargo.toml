[package]
name = "zplayer"
version = "0.1.0"
description = "A GPUI desktop client for Emby and Jellyfin"
authors = ["li"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
gpui-kit = "0.8.0"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
libc = "0.2"
libloading = "0.7.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# ponytail: keep cookie 0.18.1 compiling until upstream dependency bounds catch up.
time = "=0.3.36"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
